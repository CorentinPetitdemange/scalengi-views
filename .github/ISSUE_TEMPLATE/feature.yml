name: Propose an improvement
description: Propose a view, capability, or user-experience improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem and expected value before describing an implementation.
  - type: textarea
    id: decision
    attributes:
      label: Decision or problem to address
      description: Which architecture decision or user difficulty would this proposal improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the suggested outcome without requiring a specific implementation too early.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal does not duplicate Scalengi process modelling.
          required: true
