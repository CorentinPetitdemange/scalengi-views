name: Report a bug
description: Report reproducible unexpected behaviour in Scalengi Views.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach business data, personal data, credentials, or other confidential information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the current and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or desktop platform and version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anonymised screenshots, logs without secrets, or other useful information.
