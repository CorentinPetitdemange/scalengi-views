name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Codespaces configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json', 'utf8'))"
          bash -n .devcontainer/setup.sh
          bash -n .devcontainer/start-demo.sh
          docker compose --file .devcontainer/compose.yaml config --quiet

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Validate desktop shell
        run: pnpm desktop:check

      - name: Lint
        run: pnpm lint

      - name: Build and test
        run: pnpm test
